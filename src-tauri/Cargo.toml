[package]
name = "ai-router-app"
version.workspace = true
authors.workspace = true
description.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "ai_router_app_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
arc-swap = "1"
async-trait = "0.1"
base64 = "0.22"
log = "0.4"
minisign-verify = "=0.2.5"
reqwest = { version = "0.13", default-features = false }
router-core = { path = "../crates/router-core" }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "=2.12.2", features = ["macos-private-api", "image-png", "tray-icon"] }
tauri-plugin-log = "=2.10.1"
tauri-plugin-opener = "=2.7.2"
tauri-plugin-positioner = { version = "=2.4.0", features = ["tray-icon"] }
tauri-plugin-single-instance = "=2.5.4"
tauri-plugin-updater = { version = "=2.14.0", default-features = false, features = ["rustls-tls", "zip"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
unicode-segmentation = "1.13"
url = "2"
zeroize = "1"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.9"
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
  "NSButton",
  "NSControl",
  "NSResponder",
  "NSStatusBarButton",
  "NSStatusItem",
  "NSView",
] }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
  "NSArray",
  "NSString",
] }
platform-locale = { path = "../crates/platform-locale" }
plist = "1"
security-framework = "3.7.0"
system-configuration = "0.7"
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", rev = "a3122e894383aa068ec5365a42994e3ac94ba1b6" }

[lints]
workspace = true

[dev-dependencies]
minisign = "0.10"
tauri = { version = "=2.12.2", features = ["test"] }
tempfile = "3"
