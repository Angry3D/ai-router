name: Bug report
description: Report a reproducible AI Router defect
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Do not submit real API keys, Authorization headers, complete Codex configuration, SQLite databases, raw requests/responses, full run logs, recovery points, or user absolute paths. For security issues, use the private reporting channel.
  - type: input
    id: version
    attributes:
      label: AI Router version or commit
      placeholder: e.g. 0.1.0 or a commit SHA
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: e.g. macOS 15.6
    validations:
      required: true
  - type: dropdown
    id: hardware
    attributes:
      label: Hardware
      options:
        - Apple Silicon
        - Other (currently unsupported)
    validations:
      required: true
  - type: input
    id: codex
    attributes:
      label: Codex version
      placeholder: e.g. codex-cli 0.160.0
    validations:
      required: true
  - type: dropdown
    id: build
    attributes:
      label: Run method
      options:
        - Official GitHub Release DMG
        - AI Router.app built from source
        - pnpm tauri:qa:dev
        - AI Router QA.app built from source
        - Unofficial build
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction steps
      description: Use fictional routes, synthetic data, and safe placeholders.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
      description: You may include a stable error code shown in the UI; do not paste full logs.
    validations:
      required: true
  - type: textarea
    id: additional
    attributes:
      label: Other sanitized context
      description: Provide only what is necessary to locate the issue and has been manually reviewed.
  - type: checkboxes
    id: safety
    attributes:
      label: Sensitive data confirmation
      options:
        - label: I confirm this report contains no real API keys, complete configuration, databases, raw logs, or user absolute paths.
          required: true
        - label: I confirm this is not a security issue that requires private reporting.
          required: true
