name: Feature request
description: Propose a well-scoped, verifiable improvement
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Please describe the problem and the outcome. Do not submit real API keys, Authorization headers, complete Codex configuration, SQLite databases, raw requests/responses, full run logs, or user absolute paths.
  - type: textarea
    id: problem
    attributes:
      label: Current problem
      description: Who hits what obstacle in which scenario?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Required outcome
      description: Describe the success criteria as observable behavior; you do not need to specify an implementation up front.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope and non-goals
      description: State what must be included and what is explicitly excluded.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives already tried
  - type: checkboxes
    id: boundaries
    attributes:
      label: Current project boundaries
      options:
        - label: I understand that currently only macOS 13+ Apple Silicon, the official DMG, and source builds are supported, the same official DMG provides a Simplified Chinese and English interface only, and other languages are not supported.
          required: true
        - label: I confirm this request contains no real API keys, complete configuration, databases, or raw logs.
          required: true
