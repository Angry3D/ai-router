name: 功能建议
description: 提议一个边界明确、可验证的改进
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        请描述问题和结果，不要提交真实 API Key、Authorization header、完整 Codex 配置、SQLite 数据库、原始请求/响应、完整运行日志或用户绝对路径。
  - type: textarea
    id: problem
    attributes:
      label: 当前问题
      description: 谁在什么场景遇到什么障碍？
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: 需要达到的结果
      description: 用可观察行为描述成功条件，不要求预先指定实现。
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 范围与非目标
      description: 说明必须包含和明确不包含的内容。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 已尝试的替代方案
  - type: checkboxes
    id: boundaries
    attributes:
      label: 当前项目边界
      options:
        - label: 我理解当前仅支持 macOS 13+ Apple Silicon、简体中文、官方 DMG 和源码构建。
          required: true
        - label: 我确认本建议不含真实 API Key、完整配置、数据库或原始日志。
          required: true
