name: Native source build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".github/ISSUE_TEMPLATE/**"
      - "LICENSE"
      - "NOTICE"

permissions:
  contents: read

concurrency:
  group: native-source-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-source-build:
    name: Native / Source build
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
      - name: Enable pinned pnpm
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Record source-build inputs
        run: |
          {
            echo "## Native source-build inputs"
            echo "- Revision: $(git rev-parse HEAD)"
            echo "- Runner: $(sw_vers -productName) $(sw_vers -productVersion) $(uname -m)"
            echo "- Node: $(node --version)"
            echo "- pnpm: $(pnpm --version)"
            echo "- Cargo: $(cargo --version)"
            echo "- Rust: $(rustc --version)"
            echo "- Command: pnpm tauri:source:build"
            echo "- Distribution: source verification only; no artifact upload"
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Build unsigned production source bundle
        run: pnpm tauri:source:build
